# @package _global_

agent:
  config:
    modules:
      mlp_latent:
        _target_: protomotions.agents.common.common.Flatten
        num_in: ${agent.config.ssd_parameters.latent_dim}
        num_out: ${.num_in}
        config:
          obs_key: latents
          normalize_obs: False
          norm_clamp_value: 5

    model:
      config:
        actor:
          config:
            mu_model:
              config:
                input_models:
                  latents: ${agent.config.modules.mlp_latent}
        critic:
          config:
            input_models:
              latents: ${agent.config.modules.mlp_latent}
